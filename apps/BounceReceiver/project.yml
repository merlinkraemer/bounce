name: BounceReceiver
options:
  createIntermediateGroups: true

packages:
  BounceKit:
    path: ../BounceKit
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_NAME: Bounce
    PRODUCT_BUNDLE_IDENTIFIER: com.merlinkraemer.bounce.receiver
    BOUNCE_URL_SCHEME: bounce
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 2
    SWIFT_VERSION: 5.0
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PM5QWB5426
    TARGETED_DEVICE_FAMILY: "1"
targets:
  BounceReceiver:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BounceReceiver
    info:
      path: BounceReceiver/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - $(BOUNCE_URL_SCHEME)
        NSBonjourServices:
          - _bounce-sync._tcp
          - _bounce-dev._tcp
        NSLocalNetworkUsageDescription: Bounce uses your local network to receive audio files from your Mac.
        NSMicrophoneUsageDescription: Bounce uses the microphone to record voice memo notes for tracks.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        INFOPLIST_FILE: BounceReceiver/Info.plist
        CODE_SIGN_ENTITLEMENTS: BounceReceiver/BounceReceiver.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - package: BounceKit
        product: BounceKit
      - sdk: PhotosUI.framework
    scheme:
      gatherCoverageData: false
