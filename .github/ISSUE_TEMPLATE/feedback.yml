name: Feedback
description: Share feedback about Bounce
labels: ["feedback"]
body:
  - type: input
    id: app
    attributes:
      label: App
      description: Mac or iPhone
      placeholder: "Mac"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS or iOS version
      placeholder: "macOS 26.1 / iOS 18.2"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "MacBook Pro M3 / iPhone 15"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened and what did you expect
    validations:
      required: true
